/* ---------- Lecture d'une fiche selon la structure du formulaire ---------- */
function fmt(it,v,ch){
  if(v==null||v==='')return null;
  var L=(ch&&it.list&&ch[it.list])||{};
  if(it.type==='select_one')return L[v]||v;
  if(it.type==='select_multiple')return String(v).split(' ').filter(Boolean).map(function(x){return L[x]||x}).join(', ');
  if(it.type==='date'&&/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(8,10)+'/'+v.slice(5,7)+'/'+v.slice(0,4);
  return String(v)}
function flatQ(node,path,out){ // questions d'un tableau répété (groupes inclus)
  node.items.forEach(function(it){
    if(it.kind==='group')flatQ(it,path+it.name+'/',out);
    else if(it.kind==='q'&&it.type!=='calculate'&&it.type!=='begin_repeat')out.push({it:it,key:path+it.name});});
  return out}
function collect(node,path,data,ch,acc){
  node.items.forEach(function(it){
    if(it.kind==='group')collect(it,path+it.name+'/',data,ch,acc);
    else if(it.kind==='repeat'){
      var arr=data[path+it.name];if(!Array.isArray(arr)||!arr.length)return;
      var cols=flatQ(it,path+it.name+'/',[]),body=arr.map(function(el){return cols.map(function(c){return fmt(c.it,el[c.key],ch)||''})});
      var keep=cols.map(function(c,i){return body.some(function(r){return r[i]!==''})});
      var cl=cols.filter(function(c,i){return keep[i]}).map(function(c){return cleanLbl(c.it.label||c.it.name)});

      if(cl.length)acc.tables.push({label:cleanLbl(it.label||it.name),cols:cl,rows:br});}
    else if(it.kind==='q'&&it.type!=='calculate'){
      var v=fmt(it,data[path+it.name],ch);if(v!==null)acc.qa.push([cleanLbl(it.label||it.name),v]);}});

function utmToLL(E,N,zone,north){

function gpsPoints(st,data,zone){

  var arr=data[path+it.name];if(!Array.isArray(arr)||!arr.length)return;
  var f={x:null,y:null,xs:null,ys:null,nm:null,ds:null,ph:null};
  (function sc(n,p){n.items.forEach(function(q){
   if(q.kind==='group'){sc(q,p+q.name+'/');return}if(q.kind!=='q')return;
   var k=p+q.name;
   if(/(^|_)x$/.test(q.name))f.x=k;else if(/(^|_)x_saisie$/.test(q.name))f.xs=k;
   else if(/(^|_)y$/.test(q.name))f.y=k;else if(/(^|_)y_saisie$/.test(q.name))f.ys=k;
   else if(!f.nm&&/(num|_nom)$/.test(q.name)&&!/photo/.test(q.name))f.nm=k;
   else if(!f.ds&&/(description|observation)$/.test(q.name))f.ds=k})})(it,path+it.name+'/');
  if(!(f.x||f.xs)||!(f.y||f.ys))return;

   if(X!=null&&Y!=null&&X>100000&&X<900000&&Y>=0&&Y<10000000&&zone){var ll=utmToLL(X,Y,zone.zone,zone.north);p.lat=ll.lat;p.lon=ll.lon;p.ok=true}

  if(DEMO){var seen={};DB.fiches.filter(function(r){return!r.supprimee_le&&r.donnees&&r.donnees['p00_etape1/entete_mois']}).forEach(function(r){
    var k=[r.type_fiche,r.societe_id,String(r.site||'').trim().toLowerCase(),String(r.donnees['p00_etape1/entete_mois']).slice(0,7)].join('|');(seen[k]=seen[k]||[]).push(r.uuid)});
   Object.keys(seen).forEach(function(k){if(seen[k].length>1)seen[k].forEach(function(u){m[u]=k;(g[k]=g[k]||[]).push(u)})})}
  else{var r=await sb.rpc('fiches_doublons');if(r.error)throw r.error;r.data.forEach(function(x){m[x.uuid]=x.groupe;(g[x.groupe]=g[x.groupe]||[]).push(x.uuid)})}
 }catch(e){m={};g={}}
 DUP=m;DUPG=g};
function dupBadge(u){return DUP[u]?' <span class="badge sc" title="Même type, même site et même mois qu\'une autre fiche">Doublon ?</span>':''}
api.fichesParUuid=async function(uuids){
 if(DEMO)return DB.fiches.filter(function(r){return uuids.indexOf(r.uuid)>-1});
 return T(await sb.from('fiches').select('id,uuid,numero_fiche,soumise_le').in('uuid',uuids))};

async function adminView(tab,msg){
 if(tab)adminTab=tab;backFn=function(){adminView()};
 app('<p class="muted" style="padding:40px 0">Chargement de l\'espace administrateur…</p>');
 try{ADM.soc=await api.adminSocietes();ADM.fic=await api.adminFiches();await api.statuts();await api.doublons()}
 catch(x){app('<div class="card err">'+esc(errMsg(x))+'</div><button class="btn ghost" id="bk">Retour</button>');$('#bk').onclick=backHome;return}
 var names={};ADM.soc.forEach(function(s){names[s.id]=s.nom});
 var orph=ADM.fic.filter(function(r){return!r.societe_id});
 var tabs=[['orph','À rattacher ('+orph.length+')'],['soc','Sociétés ('+ADM.soc.length+')'],['all','Toutes les fiches ('+ADM.fic.length+')']];
 var h='<div class="top"><div class="row" style="align-items:center;flex:1 1 300px"><div><h1>Espace administrateur</h1><div class="muted" style="font-size:13px">Connecté : '+esc(user&&user.email||'')+'</div></div></div>'
  +'<div class="row" style="flex:0 0 auto;align-items:center"><div class="fit"><button class="btn ghost sm" id="am">'+(soc.length?'Mon espace société':'Créer ma société')+'</button></div><div class="fit"><button class="btn ghost sm" id="lo">'+(DEMO?'Démo':'Se déconnecter')+'</button></div></div></div>'
  +(msg?'<div class="card ok" role="status">'+esc(msg)+'</div>':'')
  +'<div class="stabs" id="atb" role="tablist">'+tabs.map(function(t){return'<button role="tab" data-t="'+t[0]+'" aria-selected="'+(t[0]===adminTab)+'" class="'+(t[0]===adminTab?'on':'')+'">'+esc(t[1])+'</button>'}).join('')+'</div>';
 var socOpts=function(sel,all){return(all?'<option value="">'+all+'</option>':'<option value="">Choisir une société…</option>')+ADM.soc.filter(function(s){return!s.supprimee_le}).map(function(s){return'<option value="'+esc(s.id)+'"'+(sel===s.id?' selected':'')+'>'+esc(s.nom)+'</option>'}).join('')};
 var body='';
 if(adminTab==='orph'){
  body='<div class="card"><h2>Fiches à rattacher</h2><p class="muted">Ces fiches ont été reçues avec un code société inconnu ou erroné : aucune société ne les voit. Ouvrez la fiche si besoin, puis choisissez la société à laquelle elle appartient.</p>'
   +(orph.length?'<div class="scroll"><table><thead><tr><th>Date</th><th>Type</th><th>N° fiche</th><th>Saisi par l\'enquêteur</th><th>Site</th><th>Action</th></tr></thead><tbody>'
   +orph.map(function(r,i){return'<tr><td class="nowrap">'+esc(fdate(r.soumise_le))+'</td><td><span class="badge">'+esc(typeName(r.type_fiche))+'</span></td><td>'+esc(r.numero_fiche||'—')+'</td><td>'+esc(r.societe||'—')+'<br><span class="muted" style="font-size:13px">Code : '+esc(r.code_saisi||'—')+'</span></td><td>'+esc(r.site||'—')+'</td>'
    +'<td><div style="display:flex;flex-direction:column;gap:6px;min-width:170px"><button class="btn ghost sm" data-o="'+r.id+'">Ouvrir la fiche</button><select data-s="'+i+'" aria-label="Société">'+socOpts('')+'</select><button class="btn sm" data-r="'+i+'">Rattacher</button></div></td></tr>'}).join('')+'</tbody></table></div>'
   :'<p class="muted">Aucune fiche à rattacher.</p>')+'<div id="am2" class="err"></div></div>'}
 else if(adminTab==='soc'){
  body='<div class="card"><h2>Sociétés</h2><div class="scroll"><table><thead><tr><th>Société</th><th>Code</th><th>Compte (e-mail)</th><th>Fiches</th><th>Créée le</th><th></th></tr></thead><tbody>'
   +(ADM.soc.length?ADM.soc.map(function(s){return'<tr><td>'+esc(s.nom)+(s.supprimee_le?' <span class="badge">corbeille</span>':'')+'</td><td><span class="code" style="font-size:14px">'+esc(s.code)+'</span></td><td>'+esc(s.email||'—')+'</td><td>'+esc(s.nb_fiches)+'</td><td class="nowrap">'+esc(fdate(s.cree_le))+'</td><td><button class="btn ghost sm" data-v="'+esc(s.id)+'">Voir les fiches</button></td></tr>'}).join(''):'<tr><td colspan="6" class="muted">Aucune société.</td></tr>')
   +'</tbody></table></div></div>'}
 else{
  var opts='<option value="">Tous les types</option>'+Object.keys(S).map(function(u){return'<option value="'+u+'"'+(adminF.type===u?' selected':'')+'>'+esc(S[u].title)+'</option>'}).join('');
  var t=adminF.text.toLowerCase();
  var list=ADM.fic.filter(function(r){return(!adminF.soc||(adminF.soc==='_none'?!r.societe_id:r.societe_id===adminF.soc))&&(!adminF.type||r.type_fiche===adminF.type)&&(!t||((r.site||'')+' '+(r.numero_fiche||'')+' '+(r.societe||'')).toLowerCase().indexOf(t)>-1)});
  body='<div class="card"><h2>Toutes les fiches</h2><div class="row"><div><label for="fs">Société</label><select id="fs"><option value="">Toutes</option><option value="_none"'+(adminF.soc==='_none'?' selected':'')+'>Sans société (à rattacher)</option>'+socOpts(adminF.soc,'').replace('<option value="">Choisir une société…</option>','')+'</select></div>'
   +'<div><label for="ft">Type de fiche</label><select id="ft">'+opts+'</select></div><div><label for="fx">Site ou numéro</label><input id="fx" value="'+esc(adminF.text)+'" placeholder="Rechercher"></div></div>'
   +'<div class="scroll" style="margin-top:12px"><table><thead><tr><th>Date</th><th>Société</th><th>Type</th><th>N° fiche</th><th>Site</th><th>Statut</th><th></th></tr></thead><tbody>'
   +(list.length?list.slice(0,300).map(function(r){return'<tr class="link" data-o="'+r.id+'" tabindex="0"><td class="nowrap">'+esc(fdate(r.soumise_le))+'</td><td>'+esc(names[r.societe_id]||'— à rattacher —')+'</td><td><span class="badge">'+esc(typeName(r.type_fiche))+'</span></td><td>'+esc(r.numero_fiche||'—')+'</td><td>'+esc(r.site||'—')+'</td><td>'+stBadge(r.uuid)+dupBadge(r.uuid)+'</td><td><button class="btn ghost sm">Ouvrir</button></td></tr>'}).join(''):'<tr><td colspan="7" class="muted">Aucune fiche pour ces critères.</td></tr>')
   +'</tbody></table></div><div class="muted" style="font-size:14px;margin-top:8px">'+Math.min(list.length,300)+' fiche(s) affichée(s) sur '+list.length+(list.length>300?' (affinez la recherche)':'')+'</div></div>'}
 app(h+body);
 $('#lo').onclick=logout;$('#am').onclick=function(){soc.length?backHome():newSocView(true)};
 $('#atb').querySelectorAll('button').forEach(function(b){b.onclick=function(){adminView(b.dataset.t)}});
 document.querySelectorAll('[data-o]').forEach(function(b){b.onclick=function(e){e.stopPropagation();ficheView(b.dataset.o)}});
 document.querySelectorAll('tr.link[data-o]').forEach(function(tr){tr.onkeydown=function(e){if(e.key==='Enter')ficheView(tr.dataset.o)}});
 document.querySelectorAll('[data-v]').forEach(function(b){b.onclick=function(){adminF={soc:b.dataset.v,type:'',text:''};adminView('all')}});
 document.querySelectorAll('[data-r]').forEach(function(b){b.onclick=async function(){
  var i=+b.dataset.r,sel=document.querySelector('[data-s="'+i+'"]');
  if(!sel.value){$('#am2').textContent='Choisissez d\'abord une société.';return}
  b.disabled=true;
  try{await api.adminRattacher(orph[i].uuid,sel.value);adminView('orph','Fiche '+(orph[i].numero_fiche||'')+' rattachée à « '+names[sel.value]+' ».')}
  catch(x){b.disabled=false;$('#am2').textContent=errMsg(x)}}});
 if($('#fs')){$('#fs').onchange=function(){adminF.soc=this.value;adminView('all')};$('#ft').onchange=function(){adminF.type=this.value;adminView('all')};
  $('#fx').onchange=function(){adminF.text=this.value;adminView('all')}}}

/* ---------- Démarrage ---------- */
async function afterLogin(session){
 if(!session){authView('in');return}
 user=session.user;
 try{isAdmin=await api.estAdmin();var st=await api.statutCompte();if(st){restoreView(st.supprime_le);return}await loadSocietes()}
 catch(x){app('<div class="card err">'+esc(errMsg(x))+'</div>')}}
(async function(){
 try{S=await (await fetch('structure.json')).json()}catch(e){app('<div class="card err">Impossible de charger la structure des fiches.</div>');return}
 if(DEMO){$('#demoBar').hidden=false;user={email:'demo@exemple.org'};await afterLogin({user:user});return}
 sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'fiches-auth'}});
 var started=false;
 sb.auth.onAuthStateChange(function(ev,s){
  setTimeout(function(){ // différé : ne pas appeler la base à l'intérieur de l'écouteur
   if(ev==='PASSWORD_RECOVERY'){started=true;recovering=true;recoveryView();return}
   if(recovering&&(ev==='INITIAL_SESSION'||ev==='SIGNED_IN')){started=true;if(s)recoveryView();else authView('in',{ok:false,t:'Lien expiré ou déjà utilisé. Demandez un nouveau lien.'});return}
   if(ev==='INITIAL_SESSION'){started=true;afterLogin(s)}
   else if(ev==='SIGNED_IN'){started=true;if(!user||(s&&s.user.id!==user.id))afterLogin(s)}
   else if(ev==='SIGNED_OUT'){user=null;soc=[];cur=null;authView('in')}
  },0)});
 setTimeout(async function(){if(started)return;var r=await sb.auth.getSession();if(!started){started=true;afterLogin(r.data.session)}},1500);
})();
</script>
