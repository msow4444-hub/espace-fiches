<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Espace gestionnaire · Fiches d'enquête</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap">
<style>
:root{
  --bg:#f3f6fa; --surface:#fff; --ink:#14202e; --muted:#55667a; --line:#d3dde8;
  --accent:#1f4e78; --accent-ink:#fff; --accent-soft:#ddebf7; --warn:#9a5b0f; --danger:#a12a2a;
  --s1:#1f4e78; --s2:#4a7fb0; --s3:#9dc3e6; --s4:#e8c766; --s5:#b38b2e;
  --fd:'Space Grotesk',system-ui,sans-serif; --fb:'Inter',system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1822; --surface:#162230; --ink:#e6edf5; --muted:#9fb1c6; --line:#27394d;
  --accent:#7fb2e0; --accent-ink:#0a1b2b; --accent-soft:#1c3249; --warn:#e0a550; --danger:#ef8c8c;
  --s1:#7fb2e0; --s2:#4a7fb0; --s3:#2b4f73; --s4:#c9a35e; --s5:#8a6a3a; color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 var(--fb)}
.strata{display:flex;height:10px}.strata i{display:block}
.strata i:nth-child(1){flex:5;background:var(--s1)}.strata i:nth-child(2){flex:3;background:var(--s2)}
.strata i:nth-child(3){flex:4;background:var(--s3)}.strata i:nth-child(4){flex:2;background:var(--s4)}.strata i:nth-child(5){flex:3;background:var(--s5)}
.wrap{max-width:1040px;margin:0 auto;padding:0 16px}
.top{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:20px 0}
.top h1{font:700 22px var(--fd);margin:0}
.top small{color:var(--muted);display:block;font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;margin-bottom:16px;min-width:0}
h2{font:600 18px var(--fd);margin:0 0 8px}
h3{font:600 16px var(--fd);margin:24px 0 8px}
p{margin:0 0 10px}.muted{color:var(--muted)}
label{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:12px 0 4px;letter-spacing:.02em}
input,select{font:inherit;width:100%;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:3px solid var(--accent-soft);outline-offset:1px;border-color:var(--accent)}
.btn{font:600 15px var(--fb);padding:10px 16px;border-radius:8px;border:0;background:var(--accent);color:var(--accent-ink);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent);border:1.5px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:14px}
.btn:disabled{opacity:.5;cursor:default}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}.row>*{flex:1 1 160px;min-width:0}.row>.fit{flex:0 0 auto}
.err{color:var(--danger);font-size:14px;margin-top:8px}.ok{color:var(--accent);font-size:14px;margin-top:8px}
.tabs{display:flex;gap:8px;margin-bottom:8px}
.tabs button{flex:1;padding:10px;border:1.5px solid var(--line);background:transparent;color:var(--muted);border-radius:8px;font:600 15px var(--fb);cursor:pointer}
.tabs button.on{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}

.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
tbody tr.link{cursor:pointer}tbody tr.link:hover{background:var(--accent-soft)}
td.nowrap{white-space:nowrap}
.badge{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.layout{display:grid;grid-template-columns:260px minmax(0,1fr);gap:16px;align-items:start}
.nav{position:sticky;top:8px;display:flex;flex-direction:column;gap:4px;max-height:80vh;overflow:auto}

.nav button.on{background:var(--accent-soft);color:var(--accent);font-weight:600}

.qa{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,4fr);gap:4px 20px;padding:9px 0;border-bottom:1px solid var(--line)}

#sc{min-width:220px;font-weight:600}
.pw{position:relative}.pw input{padding-right:46px}

.stabs button:hover{color:var(--ink)}
.stabs button.on{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.stitle{font:700 26px/1.2 var(--fd);margin:0 0 16px}
.part{font:600 16px var(--fd);margin:28px 0 8px;color:var(--accent)}
table.qt td.q{color:var(--muted);width:55%}

.chk input{width:auto}

<script>
var CFG=window.CONFIG||{};
var DEMO=!CFG.SUPABASE_URL||location.hash==='#demo';
var S=null,sb=null,soc=[],cur=null,user=null,filters={type:'',from:'',to:'',text:''},rows=[],total=0,PAGE=50;
var $=function(s){return document.querySelector(s)};
function cleanLbl(l){return String(l).replace(/\s*[–-]?\s*n°\s*\$\{[^}]*\}/g,'').replace(/\$\{[^}]*\}/g,'').replace(/\s{2,}/g,' ').replace(/\s*[–-]\s*$/,'').trim()}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fdate(v){if(!v)return'';var d=new Date(v);return isNaN(d)?String(v):d.toLocaleString('fr-FR',{dateStyle:'medium',timeStyle:'short'})}
function typeName(u){return S[u]?S[u].title:'Type inconnu'}
function app(h){$('#app').innerHTML=h}

/* ---------- Accès aux données (réel ou démo) ---------- */
var VALID=/^[A-Za-z0-9_-]{6,24}$/;
function genCode(){var a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',b=new Uint8Array(8);crypto.getRandomValues(b);return Array.from(b,function(x){return a[x%a.length]}).join('')}
function errMsg(x){var c=x&&x.code,m=(x&&x.message)||String(x);
 if(c==='23505'||/duplicate key/i.test(m))return'Ce code est déjà utilisé. Choisissez-en un autre.';
 if(c==='23514'||/code_format/i.test(m))return'Le code doit avoir 6 à 24 caractères : lettres, chiffres, tiret ou tiret bas.';
 return m}
function daysLeft(d){return Math.max(0,30-Math.floor((Date.now()-new Date(d))/864e5))}
function T(r){if(r.error)throw r.error;return r.data}
var DEMO_ROWS=[
 {id:3,societe_id:'s1',supprimee_le:null,type_fiche:'ahm2fHGsKsTpU58MApoiB4',numero_fiche:'R-014/11/2026',site:null,soumise_le:'2026-11-17T16:20:00Z',donnees:{'p00_etape1/entete_societe':'Société test','p01_a_identification/a_numero_fiche':'R-014/11/2026'}},
 {id:2,societe_id:'s1',supprimee_le:null,type_fiche:'anVthKYbRWT62fEKEv84C7',numero_fiche:'E-007/11/2026',site:'Carrière de Mbour',soumise_le:'2026-11-12T09:05:00Z',donnees:{'p00_etape1/entete_societe':'Société test','p00_etape1/entete_site':'Carrière de Mbour','p01_a_identification/a_numero_fiche':'E-007/11/2026'}},
 {id:1,societe_id:'s1',supprimee_le:null,type_fiche:'aiDFEjzPbb9XhQtxHMkEvp',numero_fiche:'F-100/11/2026',site:'Site de Kédougou',soumise_le:'2026-11-18T10:46:48Z',donnees:{
  code_societe:'A4159990','p00_etape1/titre':'petite_mine','p00_etape1/entete_societe':'Société test','p00_etape1/entete_site':'Site de Kédougou',
  'p01_a_identification/a_numero_fiche':'F-100/11/2026','p03_c_gps/c_mode':'manuel',
  'p03_c_gps/c_points':[
   {'p03_c_gps/c_points/c_date':'2026-11-18','p03_c_gps/c_points/c_appareil':'Garmin','p03_c_gps/c_points/c_point_num':'-001'},
   {'p03_c_gps/c_points/c_date':'2026-11-18','p03_c_gps/c_points/c_appareil':'Téléphone','p03_c_gps/c_points/c_point_num':'-002'}]}}
];
var DB={soc:[{id:'s1',nom:'Société test',code:'A4159990',supprimee_le:null,cree_le:'2026-11-18T10:00:00Z'}],fiches:DEMO_ROWS,compte:null};
function demoCheck(code,selfId){if(!code)return;if(!VALID.test(code))throw{code:'23514'};
 if(DB.soc.some(function(s){return s.id!==selfId&&s.code.toUpperCase()===code.toUpperCase()}))throw{code:'23505'}}
var api={
 async societes(corb){
  if(DEMO)return DB.soc.filter(function(s){return corb?s.supprimee_le:!s.supprimee_le});
  var q=sb.from('societes').select('*').order('cree_le');
  q=corb?q.not('supprimee_le','is',null):q.is('supprimee_le',null);return T(await q)},
 async createSociete(nom,code){
  if(DEMO){demoCheck(code);var s={id:'s'+(DB.soc.length+1),nom:nom,code:code||genCode(),supprimee_le:null,cree_le:new Date().toISOString()};DB.soc.push(s);return s}
  var row={nom:nom};if(code)row.code=code;return T(await sb.from('societes').insert(row).select().single())},
 async updateSociete(id,patch){
  if(DEMO){var s=DB.soc.find(function(x){return x.id===id});if(patch.code)demoCheck(patch.code,id);Object.assign(s,patch);return s}
  return T(await sb.from('societes').update(patch).eq('id',id).select().single())},
 async list(f,from){
  if(DEMO){var l=DB.fiches.filter(function(r){return r.societe_id===cur.id&&!r.supprimee_le&&(!f.type||r.type_fiche===f.type)&&(!f.from||r.soumise_le.slice(0,10)>=f.from)&&(!f.to||r.soumise_le.slice(0,10)<=f.to)});
   return{data:l.slice(from,from+PAGE),count:l.length}}
  var q=sb.from('fiches').select('id,type_fiche,numero_fiche,site,soumise_le',{count:'exact'}).eq('societe_id',cur.id).is('supprimee_le',null).order('soumise_le',{ascending:false}).range(from,from+PAGE-1);
  if(f.type)q=q.eq('type_fiche',f.type);if(f.from)q=q.gte('soumise_le',f.from);if(f.to)q=q.lte('soumise_le',f.to+'T23:59:59');
  var r=await q;if(r.error)throw r.error;return r},
 async fiche(id){if(DEMO)return DB.fiches.find(function(r){return r.id==id});return T(await sb.from('fiches').select('*').eq('id',id).single())},
 async setFicheDeleted(id,del){var v=del?new Date().toISOString():null;
  if(DEMO){DB.fiches.find(function(r){return r.id==id}).supprimee_le=v;return}
  T(await sb.from('fiches').update({supprimee_le:v}).eq('id',id).select('id').single())},
 async corbeilleFiches(){
  if(DEMO)return DB.fiches.filter(function(r){return r.supprimee_le});
  return T(await sb.from('fiches').select('id,type_fiche,numero_fiche,site,soumise_le,societe_id,supprimee_le').not('supprimee_le','is',null).order('supprimee_le',{ascending:false}))},
 async statutCompte(){
  if(DEMO)return DB.compte;
  return T(await sb.from('comptes_supprimes').select('supprime_le').maybeSingle())},
 async supprimerCompte(){
  if(DEMO){DB.compte={supprime_le:new Date().toISOString()};DB.soc.forEach(function(s){if(!s.supprimee_le)s.supprimee_le=DB.compte.supprime_le});return}
  T(await sb.rpc('supprimer_mon_compte'))},
 async restaurerCompte(){
  if(DEMO){var t=DB.compte.supprime_le;DB.soc.forEach(function(s){if(s.supprimee_le===t)s.supprimee_le=null});DB.compte=null;return}
  T(await sb.rpc('restaurer_mon_compte'))}
};

/* ---------- Lecture d'une fiche selon la structure du formulaire ---------- */
function fmt(it,v,ch){
  if(v==null||v==='')return null;
  var L=(ch&&it.list&&ch[it.list])||{};
  if(it.type==='select_one')return L[v]||v;
  if(it.type==='select_multiple')return String(v).split(' ').filter(Boolean).map(function(x){return L[x]||x}).join(', ');
  if(it.type==='date'&&/^\d{4}-\d{2}-\d{2}/.test(v))return v.slice(8,10)+'/'+v.slice(5,7)+'/'+v.slice(0,4);
  return String(v)}
function flatQ(node,path,out){ // questions d'un tableau répété (groupes inclus)
  node.items.forEach(function(it){
    if(it.kind==='group')flatQ(it,path+it.name+'/',out);
    else if(it.kind==='q'&&it.type!=='calculate'&&it.type!=='begin_repeat')out.push({it:it,key:path+it.name});});
  return out}
function collect(node,path,data,ch,acc){
  node.items.forEach(function(it){
    if(it.kind==='group')collect(it,path+it.name+'/',data,ch,acc);
    else if(it.kind==='repeat'){
      var arr=data[path+it.name];if(!Array.isArray(arr)||!arr.length)return;
      var cols=flatQ(it,path+it.name+'/',[]),body=arr.map(function(el){return cols.map(function(c){return fmt(c.it,el[c.key],ch)||''})});
      var keep=cols.map(function(c,i){return body.some(function(r){return r[i]!==''})});
      var cl=cols.filter(function(c,i){return keep[i]}).map(function(c){return cleanLbl(c.it.label||c.it.name)});
      var br=body.map(function(r){return r.filter(function(v,i){return keep[i]})});
      if(cl.length)acc.tables.push({label:cleanLbl(it.label||it.name),cols:cl,rows:br});}
    else if(it.kind==='q'&&it.type!=='calculate'){
      var v=fmt(it,data[path+it.name],ch);if(v!==null)acc.qa.push([cleanLbl(it.label||it.name),v]);}});
  return acc}
function section(sec,data,ch){var a=collect(sec,sec.name+'/',data,ch,{qa:[],tables:[]});return a}
function secTitle(s){return s.label.replace(/^Étape 1.*/,'En-tête')}

/* ---------- Écrans ---------- */
var EYE='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>';
var EYEOFF='<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
var flash='';
function logout(){if(!DEMO)sb.auth.signOut()}
function bar(showSel){
 var left='<h1>Espace gestionnaire</h1>';
 if(showSel&&soc.length)left='<div class="fit"><label for="sc" class="sr">Société</label><select id="sc">'+soc.map(function(s){return'<option value="'+esc(s.id)+'"'+(cur&&s.id===cur.id?' selected':'')+'>'+esc(s.nom)+'</option>'}).join('')+'</select></div><div class="fit"><button class="btn ghost sm" id="ns">+ Nouvelle société</button></div>';
 return'<div class="top"><div class="row" style="align-items:center;flex:1 1 300px">'+left+'</div><div class="row" style="flex:0 0 auto;align-items:center"><div class="fit"><button class="btn ghost sm" id="gc">Corbeille</button></div><div class="fit"><button class="btn ghost sm" id="ga">Mon compte</button></div><div class="fit"><button class="btn ghost sm" id="lo">'+(DEMO?'Démo':'Se déconnecter')+'</button></div></div></div>'}
function bindBar(){
 var e=$('#sc');if(e)e.onchange=function(){cur=soc.find(function(s){return s.id===e.value});try{localStorage.setItem('soc_cur',cur.id)}catch(x){}filters={type:'',from:'',to:'',text:''};listView()};
 if($('#ns'))$('#ns').onclick=function(){newSocView(true)};
 $('#gc').onclick=trashView;$('#ga').onclick=accountView;$('#lo').onclick=logout}
function pwField(id,auto){return'<div class="pw"><input id="'+id+'" type="password" minlength="8" autocomplete="'+auto+'" required><button type="button" class="eye" id="'+id+'e" aria-label="Afficher le mot de passe" aria-pressed="false">'+EYE+'</button></div>'}
function bindEye(id){var i=$('#'+id),b=$('#'+id+'e');b.onclick=function(){var show=i.type==='password';i.type=show?'text':'password';b.innerHTML=show?EYEOFF:EYE;b.setAttribute('aria-pressed',show);b.setAttribute('aria-label',show?'Masquer le mot de passe':'Afficher le mot de passe')}}

function authView(mode,msg){
 app('<div style="max-width:440px;margin:40px auto"><div class="card"><h2>Espace gestionnaire</h2><p class="muted">Consultez les fiches d\'enquête de votre société.</p>'
 +'<div class="tabs"><button id="tIn" class="'+(mode==='in'?'on':'')+'">Connexion</button><button id="tUp" class="'+(mode==='up'?'on':'')+'">Créer un compte</button></div>'
 +'<form id="af"><label for="em">Adresse e-mail</label><input id="em" type="email" autocomplete="email" required>'
 +'<label for="pw">Mot de passe</label>'+pwField('pw',mode==='in'?'current-password':'new-password')
 +'<p class="muted" style="font-size:13px;margin-top:6px">'+(mode==='up'?'8 caractères minimum.':'')+'</p>'
 +'<button class="btn" style="width:100%;margin-top:6px">'+(mode==='in'?'Se connecter':'Créer mon compte')+'</button><div id="am" class="'+(msg&&msg.ok?'ok':'err')+'">'+esc(msg?msg.t:'')+'</div></form></div></div>');
 bindEye('pw');
 $('#tIn').onclick=function(){authView('in')};$('#tUp').onclick=function(){authView('up')};
 $('#af').onsubmit=async function(e){e.preventDefault();var em=$('#em').value.trim(),pw=$('#pw').value;$('#am').textContent='';
  try{
   if(mode==='in'){var r=await sb.auth.signInWithPassword({email:em,password:pw});if(r.error)throw r.error;}
   else{var r=await sb.auth.signUp({email:em,password:pw,options:{emailRedirectTo:location.origin+location.pathname}});if(r.error)throw r.error;
     if(!r.data.session){authView('in',{ok:true,t:'Compte créé. Ouvrez le lien reçu par e-mail pour le confirmer, puis connectez-vous.'});}}
  }catch(x){$('#am').className='err';$('#am').textContent=/Invalid login/i.test(x.message)?'E-mail ou mot de passe incorrect.':/not confirmed/i.test(x.message)?'Adresse e-mail pas encore confirmée.':x.message}}}

function newSocView(canCancel){

 st._idx=m;return m}
function gv(st,data,name){var x=nameIndex(st)[name];return x?xval(x.it,data[x.key],st.choices,name):null}
function sheetName(s,used){var n=s.replace(/[\[\]:*?\/\\]/g,'').slice(0,31).trim()||'Feuille',k=n,i=2;while(used[k.toLowerCase()])k=n.slice(0,28)+' '+i++;used[k.toLowerCase()]=1;return k}

 sy.mergeCells('B2:G2');var t=sy.getCell('B2');t.value="FICHE D'ENQUÊTE TERRAIN MENSUELLE";t.fill=fillOf('1F3A8A');t.font={bold:true,size:20,color:{argb:'FFFFFFFF'}};t.alignment={vertical:'middle',indent:1};sy.getRow(2).height=40;
 sy.mergeCells('B3:G3');var t3=sy.getCell('B3');t3.value=st.title;t3.font={size:12,color:{argb:'FF334155'}};t3.alignment={indent:1};sy.getRow(3).height=22;
 var ident=[['Société',societe],['Site',site],['Mois couvert',mois],['Enquêteur',gv(st,data,'a_enqueteur')],['Responsable du site',gv(st,data,'a_responsable_nom')],['Type de titre',gv(st,data,'titre')],['Soumission',fdate(f.soumise_le)]];
 ident.forEach(function(p,i){var r=5+i;var a=sy.getCell(r,2);a.value=p[0];a.fill=fillOf('DBE4F7');a.font={bold:true,color:{argb:'FF1E293B'}};a.border=borders();
  sy.mergeCells(r,3,r,7);var b=sy.getCell(r,3);b.value=(p[1]===null||p[1]==='')?'—':p[1];b.fill=fillOf('F1F5F9');b.font={bold:true,color:{argb:'FF0F172A'}};b.border=borders();b.alignment={horizontal:'left'}});

 keys.forEach(function(k,i){var v=gv(st,data,k[1]);var c=sy.getCell(14,2+i);c.value=(v===null||v==='')?'—':v;c.fill=fillOf(k[2]);c.font={bold:true,size:22,color:{argb:'FF0F172A'}};c.alignment={horizontal:'center',vertical:'middle',wrapText:true};c.border=borders();
  var l=sy.getCell(15,2+i);l.value=k[0];l.fill=fillOf(k[2]);l.font={size:10,color:{argb:'FF475569'}};l.alignment={horizontal:'center',vertical:'middle',wrapText:true};l.border=borders()});

 var lr=18+sheets.length+1;band(sy,lr,'LÉGENDE DES COULEURS','475569',2,7);

  s.blocks.forEach(function(b){

     rw.forEach(function(c){row(null,c.label,c.val)})})}})});

async function downloadWb(wb,name){
 var buf=await wb.xlsx.writeBuffer();
 var blob=new Blob([buf],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'});
 var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();
 setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500)}

 ws.getRow(1).eachCell(function(c){c.fill=fillOf('1F3A8A');c.font={bold:true,color:{argb:'FFFFFFFF'}};c.border=borders()});
 list.forEach(function(r,i){var x=ws.addRow([fdate(r.soumise_le),typeName(r.type_fiche),r.numero_fiche||'',r.site||'']);x.eachCell(function(c){c.fill=fillOf(i%2?'F8FAFC':'FFFFFF');c.border=borders()})});
 await downloadWb(wb,'Liste_fiches_'+new Date().toISOString().slice(0,10)+'.xlsx')}

async function afterLogin(session){
 if(!session){authView('in');return}
 user=session.user;
 try{var st=await api.statutCompte();if(st){restoreView(st.supprime_le);return}await loadSocietes()}
 catch(x){app('<div class="card err">'+esc(errMsg(x))+'</div>')}}
(async function(){
 try{S=await (await fetch('structure.json')).json()}catch(e){app('<div class="card err">Impossible de charger la structure des fiches.</div>');return}
 if(DEMO){$('#demoBar').hidden=false;user={email:'demo@exemple.org'};await afterLogin({user:user});return}
 sb=supabase.createClient(CFG.SUPABASE_URL,CFG.SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true,storageKey:'fiches-auth'}});
 var started=false;
 sb.auth.onAuthStateChange(function(ev,s){
  setTimeout(function(){ // différé : ne pas appeler la base à l'intérieur de l'écouteur
   if(ev==='INITIAL_SESSION'){started=true;afterLogin(s)}
   else if(ev==='SIGNED_IN'){started=true;if(!user||(s&&s.user.id!==user.id))afterLogin(s)}
   else if(ev==='SIGNED_OUT'){user=null;soc=[];cur=null;authView('in')}
  },0)});
 setTimeout(async function(){if(started)return;var r=await sb.auth.getSession();if(!started){started=true;afterLogin(r.data.session)}},1500);
})();
</script>
